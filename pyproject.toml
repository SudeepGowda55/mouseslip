[project]
name = "gardyloo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sudeepgowda55", email = "ssudeepgowda55@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "opentslm",
    "scikit-learn>=1.9.1",
    "timenet>=0.12.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
gardyloo = "gardyloo:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
opentslm = { git = "https://github.com/OpenTSLM/OpenTSLM" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
